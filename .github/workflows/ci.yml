name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (PowerShell 5.1 y 7)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Pester y PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          Get-Module -ListAvailable Pester, PSScriptAnalyzer | Select-Object Name, Version | Format-Table -AutoSize

      - name: Análisis estático (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($results.Count -gt 0) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 240 | Write-Host
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer ha encontrado $($errors.Count) error(es)."
          }
          Write-Host "PSScriptAnalyzer: $($results.Count) aviso(s), 0 error(es)."

      - name: Pruebas (Pester)
        shell: pwsh
        run: Invoke-Pester ./tests -CI -Output Detailed

      - name: Inventario real con PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./Get-AutostartInventory.ps1 -OutputPath ./salida/pwsh
          # El código 1 solo indica que hay entradas marcadas: no debe romper el CI.
          exit 0

      - name: Inventario real con Windows PowerShell 5.1
        shell: pwsh
        run: |
          powershell -NoProfile -File ./Get-AutostartInventory.ps1 -OutputPath ./salida/winps
          # El código 1 solo indica que hay entradas marcadas: no debe romper el CI.
          exit 0

      - name: Publicar artefactos
        uses: actions/upload-artifact@v7
        with:
          name: inventario-${{ github.run_id }}
          path: salida/
          if-no-files-found: warn
